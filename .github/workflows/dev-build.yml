name: Dev Build
on:
  push:
    branches: [main]

concurrency:
  group: dev-build-${{ github.ref }}
  cancel-in-progress: true

env:
  NAME: seasons
  GODOT_VERSION: 4.7.2

jobs:
  export_debug_build:
    name: Export debug build
    runs-on: ubuntu-latest

    # Needed to release dev-XYZ build on releases
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true


      - name: Export game
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz
          relative_project_path: ./
          export_debug: true
          archive_output: true
          archive_root_folder: true
          verbose: true
          cache: true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}-dev-${{ github.run_number }}-${{ github.sha }}
          path: ${{ steps.export.outputs.archive_directory }}/*
          retention-days: 14

      - name: Release dev build
        uses: ncipollo/release-action@v1.18.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          generateReleaseNotes: true
          tag: dev-${{ github.run_number }}
          artifacts: ${{ steps.export.outputs.archive_directory }}/*
      - name: upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.export.outputs.build_directory}}/web

      - name: deploy to github pages
        id: deployment
        uses: actions/deploy-pages@v4
        

        
